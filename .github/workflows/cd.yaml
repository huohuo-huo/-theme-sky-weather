name: CD

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the theme package to
        required: true
        default: v1.0.25

permissions:
  contents: write

jobs:
  package:
    name: Package Theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.25" >> "$GITHUB_OUTPUT"
          fi

      - name: Package theme
        shell: bash
        run: |
          mkdir -p dist
          export TAG=${{ steps.release.outputs.tag }}
          python3 scripts/package-theme.py

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<'EOF'
          ## Huohuo Weather Glass

          基于 Sky Blog Theme 二次开发的动态天气玻璃风 Halo 主题。

          ### 本次更新

          - 修复 v1.0.24 中部分模板文件编码损坏导致的 Thymeleaf 解析失败和页面传输中断问题。
          - 修复 Docsme 文档页代码块被全局 code 样式压成单行的问题。
          - 修复长文档渐进加载后 Shiki 未重新高亮新代码块的问题。
          - 优化文档页资源缓存版本号。
          - README 补充 Docsme 中文路径 404 的插件侧已知问题说明。

          ### 安装

          请下载下方 `theme-sky-weather-${{ steps.release.outputs.tag }}.zip`，不要下载 GitHub 自动生成的 Source code。
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Huohuo Weather Glass $tag" --notes-file "$notes_file"
          else
            gh release create "$tag" --title "Huohuo Weather Glass $tag" --notes-file "$notes_file"
          fi
          gh release upload "$tag" dist/*.zip --clobber
