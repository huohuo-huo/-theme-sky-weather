name: CD

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the theme package to
        required: true
        default: v1.0.15

permissions:
  contents: write

jobs:
  package:
    name: Package Theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.15" >> "$GITHUB_OUTPUT"
          fi

      - name: Package theme
        shell: bash
        run: |
          mkdir -p dist
          zip -qr "dist/theme-sky-weather-${{ steps.release.outputs.tag }}.zip" . \
            -x ".git/*" ".github/*" "dist/*"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<'EOF'
          ## Huohuo Weather Glass

          基于 Sky Blog Theme 二次开发的动态天气玻璃风 Halo 主题。

          ### 主要特性

          - 白天动态云层、黄昏火烧云、夜间雨景视频背景
          - 全站玻璃卡片视觉
          - 瞬间、图库、友链、文档、分类、标签等页面适配
          - 适配 Halo 2.23.0+

          ### 安装

          请下载下方 `theme-sky-weather-${{ steps.release.outputs.tag }}.zip`，不要下载 GitHub 自动生成的 Source code。
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Huohuo Weather Glass $tag" --notes-file "$notes_file"
          else
            gh release create "$tag" --title "Huohuo Weather Glass $tag" --notes-file "$notes_file"
          fi
          gh release upload "$tag" dist/*.zip --clobber
