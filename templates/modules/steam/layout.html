<!doctype html>
<html lang="zh-CN" th:fragment="html (content)">
  <!-- ========================================== -->
  <!--        Steam 娓告垙搴撻〉闈㈠竷灞€                 -->
  <!-- 璺敱锟?steam                               -->
  <!-- 鎻掍欢锛歱lugin-steam                         -->
  <!-- ========================================== -->

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 鍚敤 View Transitions API (Safari 18+/Chrome 111+) -->
    <meta name="view-transition" content="same-origin" />

    <!-- 闃叉涓婚闂儊 -->
    <th:block th:replace="~{modules/theme-script :: inline-script}" />

    <!-- 页面标题 -->
    <title
      th:text="${title ?: 'Steam 游戏'} + ' - ' + ${site.title} + (${site.subtitle != null and !#strings.isEmpty(site.subtitle)} ? ' - ' + ${site.subtitle} : '')"
    >
      Steam 游戏
    </title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="${site.favicon}" />

    <!-- 瀛椾綋 -->
    <th:block th:replace="~{modules/font-loader :: fonts}" />
    <!-- 涓婚鏍峰紡 -->
    <link rel="stylesheet" th:href="@{/assets/css/main.css?v={version}(version='1.0.19')}" />
    <link rel="stylesheet" th:href="@{/assets/css/steam.css?v={version}(version='1.0.19')}" />
    <!-- 闊充箰鎾斁锟?CSS -->
    <th:block th:replace="~{modules/music-player :: head}" />
  </head>

  <body
    th:with="bgConfig = ${theme.config.general.global_background},
                 enableCustomBg = ${bgConfig?.enable_custom == true},
                 bgStyle = ${bgConfig?.background_style ?: 'base-200'},
                 bgClass = ${enableCustomBg ? (bgStyle == 'grid' ? 'bg-base-100' : 'bg-' + bgStyle) : 'bg-base-200'}"
    th:class="'min-h-screen text-base-content relative ' + ${bgClass}"
    x-data="{ gameBg: null }"
    x-init="fetch('/apis/api.steam.timxs.com/v1alpha1/profile').then(r => r.json()).then(d => { if(d.playing && d.summary?.gameid) gameBg = d.summary.gameid; }).catch(() => {})"
  >
    <!-- 鍔ㄦ€佹父鎴忚儗锟?(姝ｅ湪娓哥帺鏃舵樉绀猴紝寮傛鍔犺浇) -->
    <div x-show="gameBg" x-cloak class="pointer-events-none fixed inset-0 z-0">
      <img
        x-bind:src="gameBg ? 'https://cdn.cloudflare.steamstatic.com/steam/apps/' + gameBg + '/library_hero.jpg' : ''"
        class="h-full w-full object-cover opacity-20"
        @error="if(gameBg) $el.src = 'https://cdn.cloudflare.steamstatic.com/steam/apps/' + gameBg + '/header.jpg'"
      />
      <div class="via-base-100/80 to-base-100 absolute inset-0 bg-gradient-to-b from-transparent"></div>
    </div>

    <!-- 缃戞牸鑳屾櫙锛堜粎褰撻€夋嫨 grid 鏍峰紡鏃舵樉绀猴級 -->
    <div
      th:if="${enableCustomBg and bgStyle == 'grid'}"
      class="bg-grid-pattern pointer-events-none fixed inset-0 z-[1]"
    ></div>

    <div class="relative z-10">
      <!-- 鍔犺浇灞忓箷 -->
      <th:block th:replace="~{modules/loading-screen :: loading-screen}" />

      <!-- 瀵艰埅锟?-->
      <th:block th:replace="~{modules/nav :: navbar}" />

      <!-- 涓昏鍐呭鍖哄煙 -->
      <main id="swup" class="mt-6 flex-1 md:mt-8">
        <th:block th:replace="${content}" />
      </main>

      <!-- 椤佃剼 -->
      <th:block th:replace="~{modules/footer :: footer}" />
    </div>

    <div id="swup-page-extras">
      <!-- 鎮诞 Dock 鎺у埗锟?-->
      <th:block th:replace="~{modules/floating-dock :: dock}" />
    </div>

    <!-- JavaScript -->
    <div id="swup-scripts" hidden>
      <script
        type="module"
        th:src="@{/assets/js/steam.js?v={version}(version='1.0.19')}"
        data-swup-reload-script
      ></script>
    </div>
    <script type="module" th:src="@{/assets/js/main.js?v={version}(version='1.0.19')}"></script>
    <!-- 鎮诞闊充箰鎾斁锟?-->
    <th:block th:replace="~{modules/music-player :: player}" />
  </body>
</html>
