<!doctype html>
<html lang="zh-CN" th:fragment="html (content)">
  <!-- ========================================== -->
  <!--        閺堝寮搁崷鍫ャ€夐棃銏犵鐏炩偓                       -->
  <!-- 鐠侯垳鏁遍敓?friends                             -->
  <!-- 閹绘帊娆㈤敍姝眑ugin-friends                       -->
  <!-- ========================================== -->

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 閸氼垳鏁?View Transitions API (Safari 18+/Chrome 111+) -->
    <meta name="view-transition" content="same-origin" />

    <!-- 闂冨弶顒涙稉濠氼暯闂傤亞鍎?-->
    <th:block th:replace="~{modules/theme-script :: inline-script}" />

    <!-- 椤甸潰鏍囬 -->
    <title
      th:text="${(theme.config.friends_page_settings?.basic_info?.page_title ?: '鏈嬪弸鍦?)} + ' - ' + ${site.title} + (${site.subtitle != null and !#strings.isEmpty(site.subtitle)} ? ' - ' + ${site.subtitle} : '')"
    >
    </title>
    <!-- 鐎涙ぞ缍?-->
    <th:block th:replace="~{modules/font-loader :: fonts}" />
    <!-- 娑撳顣介弽宄扮础 -->
    <link rel="stylesheet" th:href="@{/assets/css/main.css?v={version}(version='1.0.24')}" />
    <!-- 闂婂厖绠伴幘顓熸杹閿?CSS -->
    <th:block th:replace="~{modules/music-player :: head}" />
  </head>

  <body
    th:with="bgConfig = ${theme.config.general.global_background},
                 enableCustomBg = ${bgConfig?.enable_custom == true},
                 bgStyle = ${bgConfig?.background_style ?: 'base-200'},
                 bgClass = ${enableCustomBg ? (bgStyle == 'grid' ? 'bg-base-100' : 'bg-' + bgStyle) : 'bg-base-200'},
                 cfg=${theme.config.friends_page_settings},"
    th:class="'min-h-screen text-base-content relative ' + ${bgClass}"
  >
    <!-- 缂冩垶鐗搁懗灞炬珯閿涘牅绮庤ぐ鎾烩偓澶嬪 grid 閺嶅嘲绱￠弮鑸垫▔缁€鐚寸礆 -->
    <div
      th:if="${enableCustomBg and bgStyle == 'grid'}"
      class="bg-grid-pattern pointer-events-none fixed inset-0 z-[1]"
    ></div>

    <div class="relative z-10">
      <th:block
        th:with="cfg=${theme.config.friends_page_settings},
               sidebarCfg=${cfg.sidebar_settings},
               showSidebar=${sidebarCfg?.show_sidebar == true},
               globalSidebarCfg = ${theme.config.general.sidebar_settings},
               useCustomSidebar = ${sidebarCfg?.enable_custom_sidebar == true},
               sidebarPosition = ${useCustomSidebar ? (sidebarCfg?.sidebar_position ?: 'right') : (globalSidebarCfg?.position ?: 'right')}"
      >
        <!-- 閸旂姾娴囩仦蹇撶 -->
        <th:block th:replace="~{modules/loading-screen :: loading-screen}" />

        <!-- 鐎佃壈鍩呴敓?-->
        <th:block th:replace="~{modules/nav :: navbar}" />

        <!-- 娑撴槒顩﹂崘鍛啇閸栧搫鐓?-->
        <main
          id="swup"
          class="flex-1"
          th:with="listStyle=${cfg?.basic_info?.list_style ?: 'single_column'},
                                       maxWidth=${listStyle == 'single_column' ? (showSidebar ? 'max-w-5xl' : 'max-w-3xl') : (showSidebar ? 'max-w-6xl' : 'max-w-5xl')}"
        >
          <div class="mx-auto px-4 py-6 md:py-10" th:classappend="${maxWidth}">
            <div class="flex gap-8" th:classappend="${sidebarPosition == 'left'} ? 'flex-row-reverse' : ''">
              <!-- 娑撹鍞撮敓?-->
              <div class="min-w-0 flex-1">
                <th:block th:replace="${content}" />
              </div>
              <!-- 娓氀嗙珶閿?-->
              <aside th:if="${showSidebar}" class="sticky top-20 hidden w-80 shrink-0 space-y-6 self-start lg:block">
                <th:block th:replace="~{modules/widgets/sidebar :: dynamic(${sidebarCfg})}" />
              </aside>
            </div>
          </div>
        </main>

        <!-- 妞や絻鍓?-->
        <th:block th:replace="~{modules/footer :: footer}" />
      </th:block>
    </div>

    <div id="swup-page-extras">
      <!-- 閹剚璇為幒褍鍩楅敓?-->
      <th:block
        th:replace="~{modules/floating-dock :: dockWithConfig(${theme.config.friends_page_settings}, 'basic')}"
      />
    </div>

    <!-- JavaScript -->
    <div id="swup-scripts" hidden>
      <!-- friends 妞ゅ灚妫ら悪顒傜彌妞ょ敻娼?JS閿涘瞼鏁ら弲顕€鈧俺鍓奸張顒婄礄閸氬本顒為幍褑顢戦敍澶婂絺闁礁姘ㄧ紒顏冧繆閿?-->
      <script data-swup-reload-script>
        window.__completeSwupPageInit?.();
      </script>
    </div>
    <script type="module" th:src="@{/assets/js/main.js?v={version}(version='1.0.24')}"></script>
    <!-- 閹剚璇為棅鍏呯閹绢厽鏂侀敓?-->
    <th:block th:replace="~{modules/music-player :: player}" />
  </body>
</html>
