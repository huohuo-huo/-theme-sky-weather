<!-- ========================================== -->
<!--        鐬棿璇︽儏椤碉紙璺宠浆浣跨敤锛?                -->
<!-- 鍏煎鍩虹嚎锛歅luginMoments v1.16.0锛涙彃浠跺彉閲忥細moment锛岃瘎璁?subject 涓?moment.halo.run/Moment銆?-->
<!-- ========================================== -->
<th:block th:fragment="content">

  <th:block th:with="
    cfg=${theme.config.moments_settings},
    enableUpvote=${cfg?.enable_upvote != false},
    enableComment=${cfg?.enable_comment != false},
    enableShare=${cfg?.enable_share != false},
    shareSettings=${cfg?.share_settings},
    shareItemIds=${shareSettings?.share_item_ids ?: {'wechat','weibo','x','qq'}},
    content=${moment.spec.content}
  ">

    <div class="max-w-2xl mx-auto px-4 py-8">

      <!-- 杩斿洖鎸夐挳 -->
      <div class="mb-6">
        <a href="/moments" class="btn btn-sm btn-ghost gap-1">
          <span class="icon-[heroicons--arrow-left] size-4"></span>
          杩斿洖鐬棿
        </a>
      </div>

      <!-- 鐬棿鍗＄墖 - 涓庡垪琛ㄩ〉鏍峰紡涓€鑷?-->
      <article class="card bg-base-100 shadow-sm rounded-2xl overflow-hidden">
        <div class="p-4">
          <!-- 澶撮儴锛氬ご鍍?+ 鐢ㄦ埛鍚?+ 鏃堕棿 -->
          <div class="flex items-center gap-3 mb-3">
            <div class="avatar">
              <a th:href="@{/authors/{name}(name=${moment.owner.name})}"
                class="w-11 h-11 rounded-xl bg-base-200 block transition-transform active:scale-95">
                <img th:if="${moment.owner?.avatar != null}" th:src="${moment.owner.avatar}"
                  th:alt="${moment.owner.displayName}" />
                <div th:if="${moment.owner?.avatar == null}"
                  class="w-full h-full flex items-center justify-center text-base-content/40 font-semibold"
                  th:text="${moment.owner?.displayName != null ? #strings.substring(moment.owner.displayName, 0, 1) : 'U'}">
                  U</div>
              </a>
            </div>
            <div class="flex-1 min-w-0">
              <a th:href="@{/authors/{name}(name=${moment.owner.name})}"
                class="font-semibold text-primary text-sm truncate hover:underline"
                th:text="${moment.owner?.displayName ?: '鍖垮悕鐢ㄦ埛'}">鐢ㄦ埛鍚?/a>
              <div class="text-xs text-base-content/40"
                th:text="${#temporals.format(moment.spec.releaseTime, 'MM-dd HH:mm')}">11-27 14:00</div>
            </div>
          </div>

          <!-- 鏂囧瓧鍐呭 -->
          <div th:if="${not #strings.isEmpty(content.html)}" class="text-sm text-base-content leading-relaxed mb-3"
            th:utext="${content.html}">
            浠婂ぉ鐨勫ぉ姘旂湡濂?..
          </div>

          <!-- 濯掍綋鍖哄煙 -->
          <div th:if="${content.medium != null && !content.medium.isEmpty()}" class="moment-media mb-3">
            <!-- 鍗曞浘 -->
            <th:block th:if="${#lists.size(content.medium) == 1}">
              <th:block th:each="medium : ${content.medium}">
                <div th:if="${medium.type.name == 'PHOTO'}" class="moment-single-img-wrap">
                  <img th:src="${medium.url}" alt="鐬棿鍥剧墖" class="max-h-72 object-cover" loading="lazy" />
                </div>
                <video th:if="${medium.type.name == 'VIDEO'}" th:src="${medium.url}" controls preload="metadata"
                  class="rounded-xl max-h-72 w-full">
                </video>
                <div th:if="${medium.type.name == 'AUDIO'}" class="bg-base-200 rounded-xl p-3">
                  <audio th:src="${medium.url}" controls class="w-full"></audio>
                </div>
                <th:block th:if="${medium.type.name == 'POST'}">
                  <th:block th:replace="~{modules/moments/post-media :: post-card(${medium}, false)}" />
                </th:block>
              </th:block>
            </th:block>

            <!-- 澶氬獟浣撶綉鏍硷細POST 鍗曠嫭鏀惧湪缃戞牸鍚庯紝閬垮厤褰卞搷鍥剧墖鎺掔増 -->
            <th:block th:if="${#lists.size(content.medium) > 1}" th:with="
              nonPostMedia = ${content.medium.?[type.name() != 'POST']},
              postMedia = ${content.medium.?[type.name() == 'POST']}
            ">
              <div th:if="${nonPostMedia != null and !nonPostMedia.isEmpty()}"
                class="grid gap-1 rounded-xl overflow-hidden"
                th:classappend="${
                  #lists.size(nonPostMedia) == 1 ? 'grid-cols-1' :
                  #lists.size(nonPostMedia) == 2 ? 'grid-cols-2 w-3/4' :
                  #lists.size(nonPostMedia) == 3 ? 'grid-cols-3' :
                  #lists.size(nonPostMedia) == 4 ? 'grid-cols-2 w-3/4' :
                  #lists.size(nonPostMedia) == 5 ? 'grid-cols-6' :
                  #lists.size(nonPostMedia) == 6 ? 'grid-cols-3' :
                  #lists.size(nonPostMedia) == 7 ? 'grid-cols-12' :
                  #lists.size(nonPostMedia) == 8 ? 'grid-cols-6' : 'grid-cols-3'
                }">
              <th:block th:each="medium, stat : ${nonPostMedia}">
                <div th:if="${medium.type.name == 'PHOTO' && stat.index < 9}" class="moment-grid-item" th:classappend="${
                    #lists.size(nonPostMedia) == 3 && stat.index == 0 ? 'col-span-2 row-span-2 aspect-square' :
                    #lists.size(nonPostMedia) == 3 && stat.index > 0 ? 'col-span-1 aspect-square' :
                    #lists.size(nonPostMedia) == 5 && stat.index < 2 ? 'col-span-3 aspect-[4/3]' :
                    #lists.size(nonPostMedia) == 5 && stat.index >= 2 ? 'col-span-2 aspect-square' :
                    #lists.size(nonPostMedia) == 7 && stat.index < 3 ? 'col-span-4 aspect-square' :
                    #lists.size(nonPostMedia) == 7 && stat.index >= 3 ? 'col-span-3 aspect-square' :
                    #lists.size(nonPostMedia) == 8 && stat.index < 2 ? 'col-span-3 aspect-[4/3]' :
                    #lists.size(nonPostMedia) == 8 && stat.index >= 2 ? 'col-span-2 aspect-square' : 'aspect-square'
                  }">
                  <img th:src="${medium.url}" alt="鐬棿鍥剧墖" loading="lazy" />
                  <div th:if="${stat.index == 8 && #lists.size(nonPostMedia) > 9}"
                    class="absolute inset-0 bg-black/50 flex items-center justify-center" style="z-index:2">
                    <span class="text-white text-xl font-semibold"
                      th:text="'+' + (${#lists.size(nonPostMedia)} - 9)">+3</span>
                  </div>
                </div>
                <video th:if="${medium.type.name == 'VIDEO'}" th:src="${medium.url}" controls preload="metadata"
                  class="col-span-full rounded-xl max-h-72 w-full">
                </video>
                <div th:if="${medium.type.name == 'AUDIO'}" class="col-span-full bg-base-200 rounded-xl p-3">
                  <audio th:src="${medium.url}" controls class="w-full"></audio>
                </div>
              </th:block>
              </div>
              <div th:if="${postMedia != null and !postMedia.isEmpty()}" class="mt-2 space-y-2">
                <th:block th:each="medium : ${postMedia}">
                  <th:block th:replace="~{modules/moments/post-media :: post-card(${medium}, false)}" />
                </th:block>
              </div>
            </th:block>
          </div>

          <!-- 鏍囩 -->
          <div th:if="${moment.spec.tags != null && !moment.spec.tags.isEmpty()}" class="mb-3 flex flex-wrap gap-1.5">
            <a th:each="tag : ${moment.spec.tags}" th:href="@{/moments(tag=${tag})}"
              class="badge badge-sm badge-ghost text-primary" th:text="'#' + ${tag}">#鏍囩</a>
          </div>

          <!-- 浜掑姩鎿嶄綔 -->
          <div class="flex items-center gap-4 pt-2 border-t border-base-200 text-sm text-base-content/50">
            <!-- 鐐硅禐鎸夐挳 -->
            <button th:if="${enableUpvote}" class="inline-flex items-center gap-1.5 hover:text-error transition-colors"
              th:data-moment-name="${moment.metadata.name}" th:data-upvote-count="${moment.stats?.upvote ?: 0}"
              onclick="handleMomentUpvote(this)">
              <span class="icon-[heroicons--heart] size-5"></span>
              <span class="upvote-count" th:text="${moment.stats?.upvote ?: 0}">0</span>
            </button>
            <!-- 璇勮鏁?-->
            <div th:if="${enableComment}" class="inline-flex items-center gap-1.5">
              <span class="icon-[heroicons--chat-bubble-left] size-5"></span>
              <span th:text="${moment.stats?.totalComment ?: 0}">0</span>
            </div>
            <!-- 鍒嗕韩 -->
            <button th:if="${enableShare}" x-data @click="$dispatch('open-share-modal')"
              class="inline-flex items-center gap-1.5 hover:text-primary transition-colors">
              <span class="icon-[heroicons--share] size-5"></span>
            </button>
          </div>

          <!-- 璇勮鍖?- 鐩存帴鏄剧ず -->
          <div th:if="${enableComment}" class="mt-3 pt-3 border-t border-base-200">
            <halo:comment group="moment.halo.run" kind="Moment" th:attr="name=${moment.metadata.name}"
              colorScheme="system">
            </halo:comment>
          </div>
        </div>
      </article>

    </div>

    <!-- 鍒嗕韩寮圭獥 - 浣跨敤閫氱敤缁勪欢 -->
    <th:block th:if="${enableShare}">
      <th:block th:replace="~{modules/share-modal :: shareModal(
        title='鍒嗕韩鐬棿',
        shareUrl=${'/moments/' + moment.metadata.name},
        shareTitle=${(moment.owner?.displayName ?: '鍖垮悕鐢ㄦ埛') + ' 鐨勭灛闂?},
        shareItemIds=${shareItemIds}
      )}" />
    </th:block>

  </th:block>

</th:block>
