<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">
  <!-- ========================================== -->
  <!--          涓婚鍒囨崲鍐呰仈鑴氭湰锛堥槻闂儊锛?         -->
  <!-- ========================================== -->

  <!--
  姝よ剼鏈繀椤诲湪 <head> 涓敖鏃╂墽琛岋紝鍦ㄩ〉闈㈡覆鏌撳墠搴旂敤涓婚
  閬垮厤椤甸潰鍔犺浇鏃剁殑涓婚闂儊闂
  
  浼樺厛绾ч€昏緫锛?  1. 濡傛灉鍓嶇寮€鍏冲紑鍚?&& localStorage 鏈夌紦瀛?鈫?浣跨敤缂撳瓨涓婚
  2. 鍚﹀垯 鈫?浣跨敤榛樿閰嶇疆涓婚
-->
  <script th:fragment="inline-script" th:inline="javascript">
    (function () {
      // === 涓婚鍒濆鍖?===
      const showThemeToggle = /*[[${theme.config.nav.theme_settings.show_theme_toggle}]]*/ true;
      const savedTheme = localStorage.getItem("theme-mode");
      const defaultTheme = /*[[${theme.config.nav.theme_settings.default_theme}]]*/ "dark_theme";
      const lightTheme = /*[[${theme.config.nav.theme_settings.light_theme}]]*/ "light";
      const darkTheme = /*[[${theme.config.nav.theme_settings.dark_theme}]]*/ "dark";

      // === 娉ㄥ叆鐜鍙橀噺 ===
      window.SYS_WEATHER_DEBUG = /*[[${theme.config.general.debug_settings.enable_weather_debug ?: false}]]*/ false; // 鏃у吋瀹规帴鍙?      window.SYS_GLOBAL_DEBUG = window.SYS_WEATHER_DEBUG; // 灏嗘潵濡傛灉鏈夊叏灞€鍏朵粬 debug 鍙湪姝ゅ鍙犲姞
      window.SkyWeatherGlassConfig = {
        enabled: /*[[${theme.config.index.background_settings.background_type == 'weather-glass'}]]*/ false,
        mode: /*[[${theme.config.index.background_settings.weather_glass_mode ?: 'auto'}]]*/ "auto",
        cloudSpeed: /*[[${theme.config.index.background_settings.weather_glass_cloud_speed ?: 42}]]*/ 42,
        cloudCount: /*[[${theme.config.index.background_settings.weather_glass_cloud_count ?: 18}]]*/ 18,
        rainDensity: /*[[${theme.config.index.background_settings.weather_glass_rain_density ?: 52}]]*/ 52,
        rainSpeed: /*[[${theme.config.index.background_settings.weather_glass_rain_speed ?: 55}]]*/ 55,
        rainWind: /*[[${theme.config.index.background_settings.weather_glass_rain_wind ?: 0}]]*/ 0,
        nightMedia: /*[[${theme.config.index.background_settings.weather_glass_night_media ?: ''}]]*/ "",
        nightMediaPlaylist: /*[[${theme.config.index.background_settings.weather_glass_night_media_playlist ?: ''}]]*/ "",
        nightMediaOrder: /*[[${theme.config.index.background_settings.weather_glass_night_media_order ?: 'sequence'}]]*/ "sequence",
        nightMediaOpacity: /*[[${theme.config.index.background_settings.weather_glass_night_media_opacity ?: 34}]]*/ 34,
      };

      // === PJAX 寮€鍏?===
      // 闊充箰鎾斁鍣ㄥ紑鍚椂寮哄埗鍚敤 PJAX锛堢画鎾緷璧栵級锛屽惁鍒欒鍚庡彴閰嶇疆
      const musicEnabled = /*[[${theme.config.music?.music_settings?.enable == true}]]*/ false;
      const pjaxSetting = /*[[${theme.config.music?.music_settings?.enable_pjax != false}]]*/ true;
      window.__skyPjaxEnabled = musicEnabled || pjaxSetting;

      // === PJAX 鑴氭湰鐢熷懡鍛ㄦ湡宸ュ叿 ===
      // 淇濈暀 SkyPjax 鍚嶇О浣滀负鍘嗗彶鍏煎鎺ュ彛锛屼緵鍚庡彴娉ㄥ叆鑴氭湰浣跨敤锛?      // - SkyPjax.once(key, fn): 鍏ㄧ珯鍙墽琛屼竴娆★紝閫傚悎鐐瑰嚮鐗规晥銆佺粺璁°€佹挱鏀惧櫒绛夊叏灞€鑴氭湰
      // - SkyPjax.onPage(fn): 棣栧睆鍜屾瘡娆?PJAX 鍚庢墽琛岋紝閫傚悎褰撳墠椤甸潰 DOM 鍒濆鍖?      // - SkyPjax.onCleanup(fn): PJAX 绂诲紑褰撳墠椤靛墠鎵ц锛岄€傚悎娓呯悊鐩戝惉鍣?瀹氭椂鍣?      const pjaxState = window.__skyPjaxState || {
        onceKeys: new Set(),
        pageCallbacks: new Set(),
        cleanupCallbacks: new Set(),
        currentPage: null,
      };
      window.__skyPjaxState = pjaxState;

      const safeRun = function (fn, label) {
        try {
          return fn();
        } catch (error) {
          console.error("[ThemePjax] " + label + " failed:", error);
        }
      };

      window.SkyPjax = window.SkyPjax || {
        once(key, fn) {
          if (!key || typeof fn !== "function") return false;
          const cacheKey = String(key);
          if (pjaxState.onceKeys.has(cacheKey)) return false;
          pjaxState.onceKeys.add(cacheKey);
          safeRun(fn, "once(" + cacheKey + ")");
          return true;
        },
        onPage(fn, options) {
          if (typeof fn !== "function") return function () {};
          const opts = options || {};
          pjaxState.pageCallbacks.add(fn);
          if (opts.immediate !== false && pjaxState.currentPage) {
            safeRun(function () {
              fn(pjaxState.currentPage);
            }, "onPage");
          }
          return function () {
            pjaxState.pageCallbacks.delete(fn);
          };
        },
        onCleanup(fn) {
          if (typeof fn !== "function") return function () {};
          pjaxState.cleanupCallbacks.add(fn);
          return function () {
            pjaxState.cleanupCallbacks.delete(fn);
          };
        },
        _runPage(detail) {
          const pageDetail = detail || {};
          pjaxState.currentPage = pageDetail;
          pjaxState.pageCallbacks.forEach(function (fn) {
            safeRun(function () {
              fn(pageDetail);
            }, "page callback");
          });
          document.dispatchEvent(new CustomEvent("sky:page-load", { detail: pageDetail }));
        },
        _cleanup(detail) {
          const cleanupDetail = detail || {};
          pjaxState.cleanupCallbacks.forEach(function (fn) {
            safeRun(function () {
              fn(cleanupDetail);
            }, "cleanup callback");
          });
          document.dispatchEvent(new CustomEvent("sky:page-cleanup", { detail: cleanupDetail }));
        },
      };

      // === 瑙ｆ瀽绯荤粺涓婚鍋忓ソ ===
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");

      // 璁＄畻褰撳墠鏄惁涓烘殫鑹叉ā寮?      // 浼樺厛绾э細localStorage > 榛樿閰嶇疆锛宎uto 妯″紡璺熼殢绯荤粺
      function resolveIsDark() {
        const effectiveMode = showThemeToggle && savedTheme ? savedTheme : defaultTheme;
        if (effectiveMode === "auto") {
          return prefersDark.matches;
        }
        return effectiveMode === "dark_theme";
      }

      const isDark = resolveIsDark();
      const themeName = isDark ? darkTheme : lightTheme;
      const themeMode = isDark ? "dark" : "light";

      document.documentElement.setAttribute("data-theme", themeName);
      document.documentElement.setAttribute("data-color-scheme", themeMode);

      function handleSystemThemeChange(e) {
        var currentMode =
          showThemeToggle && localStorage.getItem("theme-mode") ? localStorage.getItem("theme-mode") : defaultTheme;
        if (currentMode !== "auto") return;
        var newIsDark = e.matches;
        var newThemeName = newIsDark ? darkTheme : lightTheme;
        var newThemeMode = newIsDark ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", newThemeName);
        document.documentElement.setAttribute("data-color-scheme", newThemeMode);
      }

      // 鐩戝惉绯荤粺涓婚鍙樺寲锛堜粎鍦?auto 妯″紡涓嬪搷搴旓級
      if (typeof prefersDark.addEventListener === "function") {
        prefersDark.addEventListener("change", handleSystemThemeChange);
      } else if (typeof prefersDark.addListener === "function") {
        prefersDark.addListener(handleSystemThemeChange);
      }

      // === 鍏ㄥ眬瀛椾綋鎸夐渶鍔犺浇 ===
      const bodyFont = /*[[${theme.config.general.font_settings.body_font}]]*/ "font-default";
      const fontCdn = /*[[${theme.config.general.font_settings.font_cdn}]]*/ "";

      // 鍔犺浇瀛椾綋鏂囦欢
      if (fontCdn && bodyFont === "font-lxgw-wenkai-bright") {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = fontCdn + "/LXGWBright-SemiLight/result.css";
        document.head.appendChild(link);
      } else if (fontCdn && bodyFont === "font-siyuan-songti") {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = fontCdn + "/鎬濇簮灞忔樉鑷诲畫/result.css";
        document.head.appendChild(link);
      }

      // 搴旂敤瀛椾綋绫诲埌 html 鍏冪礌锛堝叏灞€鐢熸晥锛?      if (bodyFont && bodyFont !== "font-default") {
        document.documentElement.classList.add(bodyFont);
      }
    })();
  </script>
</html>
