<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- ========================================== -->
<!--              Logo 娓叉煋缁勪欢                  -->
<!-- ========================================== -->

<!--
  鍙傛暟璇存槑锛?  - sizeClass: Logo 鍥炬爣鐨勫昂瀵哥被锛堝 'w-8 h-8' 鎴?'w-6 h-6'锛?  
  logo_type 鍙€夊€硷細
  - none: 涓嶆樉绀哄浘鏍?  - system: 浣跨敤绯荤粺璁剧疆锛圚alo 鍚庡彴璁剧疆 鈫?鍩烘湰璁剧疆 鈫?Logo锛?  - svg: 鏄剧ず SVG 浠ｇ爜
  - image: 鏄剧ず涓婁紶鐨勫浘鐗?-->

<!-- Logo 鍥炬爣娓叉煋鐗囨 -->
<span th:fragment="icon(sizeClass)">
  <!-- 绯荤粺璁剧疆绫诲瀷 -->
  <img th:if="${theme.config.nav.logo_settings.logo_type == 'system' && !#strings.isEmpty(site.logo)}"
    th:src="${site.logo}"
    th:alt="${#strings.isEmpty(theme.config.nav.logo_settings.custom_logo_title) ? site.title : theme.config.nav.logo_settings.custom_logo_title}"
    th:class="${sizeClass} + ' object-contain'" />

  <!-- Iconify 鍥炬爣閫夋嫨鍣ㄧ被鍨?- 鍏煎涓ょ鏁版嵁鏍煎紡 -->
  <!-- 瀵硅薄鏍煎紡锛氫笉鏄互 <svg 寮€澶?-->
  <span
    th:if="${theme.config.nav.logo_settings.logo_type == 'iconify' and theme.config.nav.logo_settings.logo_icon != null and !theme.config.nav.logo_settings.logo_icon.toString().startsWith('<svg')}"
    th:utext="${theme.config.nav.logo_settings.logo_icon['value']}"
    th:class="${sizeClass} + ' text-primary flex items-center justify-center'">
  </span>
  <!-- 瀛楃涓叉牸寮忥細浠?<svg 寮€澶?-->
  <span
    th:if="${theme.config.nav.logo_settings.logo_type == 'iconify' and theme.config.nav.logo_settings.logo_icon != null and theme.config.nav.logo_settings.logo_icon.toString().startsWith('<svg')}"
    th:utext="${theme.config.nav.logo_settings.logo_icon}"
    th:class="${sizeClass} + ' text-primary flex items-center justify-center'">
  </span>

  <!-- SVG 浠ｇ爜绫诲瀷 -->
  <span th:if="${theme.config.nav.logo_settings.logo_type == 'svg'}"
    th:utext="${theme.config.nav.logo_settings.logo_icon_html}"
    th:class="${sizeClass} + ' text-primary flex items-center justify-center'">
  </span>

  <!-- 鍥剧墖绫诲瀷 -->
  <img
    th:if="${theme.config.nav.logo_settings.logo_type == 'image' && !#strings.isEmpty(theme.config.nav.logo_settings.logo_image)}"
    th:src="${theme.config.nav.logo_settings.logo_image}"
    th:alt="${#strings.isEmpty(theme.config.nav.logo_settings.custom_logo_title) ? site.title : theme.config.nav.logo_settings.custom_logo_title}"
    th:class="${sizeClass} + ' object-contain'" />
</span>

<!-- Logo 鏍囬娓叉煋鐗囨 -->
<span th:fragment="title" th:if="${theme.config.nav.logo_settings.show_logo_title}"
  th:text="${#strings.isEmpty(theme.config.nav.logo_settings.custom_logo_title) ? site.title : theme.config.nav.logo_settings.custom_logo_title}">
</span>

</html>
