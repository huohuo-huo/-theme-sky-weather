<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- ========================================== -->
<!--        杩界暘椤甸潰涓讳綋鍐呭                     -->
<!-- 鍏煎鍩虹嚎锛歱lugin-bilibili-bangumi 1.4.0锛涙秷璐?bangumis.items/prevUrl/nextUrl/typeNum/status銆?-->
<!-- ========================================== -->

<main class="bangumi-page relative" th:fragment="bangumi-content">

  <div class="max-w-6xl mx-auto px-4 py-8">

    <!-- 椤甸潰澶撮儴 -->
    <header class="bangumi-header bangumi-animate-in">
      <h1 class="bangumi-title" th:text="${theme.config.bangumi_settings?.page_title} ?: '杩界暘鍒楄〃'">杩界暘鍒楄〃</h1>
      <p class="bangumi-subtitle" th:text="${theme.config.bangumi_settings?.page_description} ?: '璁板綍鎴戠殑浜屾鍏冧箣鏃?">璁板綍鎴戠殑浜屾鍏冧箣鏃?/p>
    </header>

    <!-- 绛涢€夋爮 -->
    <nav class="bangumi-nav bangumi-animate-in bangumi-stagger-1"
         th:with="currentType = ${bangumis?.typeNum ?: 1}, currentStatus = ${bangumis?.status ?: 0}">
      <div class="bangumi-nav-group">
        <a th:href="@{/bangumis(typeNum=1, status=${currentStatus})}" 
           th:classappend="${currentType == 1} ? 'active' : ''"
           class="bangumi-nav-item">
          <!-- 杩界暘鍥炬爣 -->
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
          </svg>
          杩界暘
        </a>
        <a th:href="@{/bangumis(typeNum=2, status=${currentStatus})}" 
           th:classappend="${currentType == 2} ? 'active' : ''"
           class="bangumi-nav-item">
          <!-- 杩藉墽鍥炬爣 -->
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="15" rx="2" ry="2"/>
            <polyline points="17 2 12 7 7 2"/>
          </svg>
          杩藉墽
        </a>
      </div>
      <div class="bangumi-nav-divider"></div>
      <div class="bangumi-nav-group">
        <a th:href="@{/bangumis(typeNum=${currentType}, status=0)}" 
           th:classappend="${currentStatus == 0} ? 'active' : ''"
           class="bangumi-nav-item">鍏ㄩ儴</a>
        <a th:href="@{/bangumis(typeNum=${currentType}, status=1)}" 
           th:classappend="${currentStatus == 1} ? 'active' : ''"
           class="bangumi-nav-item">鎯崇湅</a>
        <a th:href="@{/bangumis(typeNum=${currentType}, status=2)}" 
           th:classappend="${currentStatus == 2} ? 'active' : ''"
           class="bangumi-nav-item">鍦ㄧ湅</a>
        <a th:href="@{/bangumis(typeNum=${currentType}, status=3)}" 
           th:classappend="${currentStatus == 3} ? 'active' : ''"
           class="bangumi-nav-item">宸茬湅</a>
      </div>
      <span th:if="${bangumis != null && bangumis.total > 0}" class="bangumi-count">
        鍏?<strong th:text="${bangumis.total}">0</strong> 閮?      </span>
    </nav>

    <!-- 鐣墽鍒楄〃 -->
    <section th:if="${bangumis != null && bangumis.items != null}" class="bangumi-section bangumi-animate-in bangumi-stagger-2">
      
      <!-- 鐣墽鍗＄墖缃戞牸 -->
      <div th:if="${!bangumis.items.isEmpty()}" class="bangumi-grid">
        <th:block th:each="bangumi : ${bangumis.items}">
          <a th:href="${bangumi.spec.url}" target="_blank" rel="noopener noreferrer" class="bangumi-card">
            <!-- 灏侀潰 -->
            <div class="bangumi-cover">
              <img th:src="${#strings.contains(bangumi.spec.cover, '@') ? #strings.substringBefore(bangumi.spec.cover, '@') : bangumi.spec.cover}" 
                   th:alt="${bangumi.spec.title}" 
                   loading="lazy" 
                   decoding="async"
                   referrerpolicy="no-referrer" />
              <!-- 璇勫垎瑙掓爣 -->
              <span th:if="${bangumi.spec.score != null && bangumi.spec.score != ''}" class="bangumi-score">
                <span th:text="${bangumi.spec.score}">0</span>
              </span>
            </div>
            <!-- 鏍囬 -->
            <div class="bangumi-info">
              <h3 class="bangumi-name" th:text="${bangumi.spec.title}">鐣墽鍚嶇О</h3>
              <span th:if="${bangumi.spec.totalCount != null}" class="bangumi-ep" th:text="${bangumi.spec.totalCount}">鍏?2璇?/span>
            </div>
          </a>
        </th:block>
      </div>

      <!-- 绌虹姸鎬?-->
      <div th:if="${bangumis.items.isEmpty()}" class="bangumi-empty">
        <div class="bangumi-empty-icon">馃摵</div>
        <p>鏆傛棤杩界暘鏁版嵁</p>
      </div>

      <!-- 鍒嗛〉 -->
      <div th:if="${bangumis.hasPrevious or bangumis.hasNext}" class="bangumi-pagination">
        <a th:if="${bangumis.hasPrevious}" th:href="@{${bangumis.prevUrl}}" class="bangumi-page-btn">
          <span class="icon-[heroicons--chevron-left] w-5 h-5"></span>
        </a>
        <span class="bangumi-page-info">
          <span th:text="${bangumis.page}">1</span> / <span th:text="${bangumis.totalPages}">1</span>
        </span>
        <a th:if="${bangumis.hasNext}" th:href="@{${bangumis.nextUrl}}" class="bangumi-page-btn">
          <span class="icon-[heroicons--chevron-right] w-5 h-5"></span>
        </a>
      </div>
    </section>

    <!-- 閿欒鎻愮ず -->
    <div th:if="${bangumis == null}" class="bangumi-error bangumi-animate-in">
      <p>杩界暘鏁版嵁鍔犺浇澶辫触锛岃妫€鏌ユ彃浠堕厤缃?/p>
    </div>

  </div>
</main>

</html>
