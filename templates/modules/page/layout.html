<!doctype html>
<html lang="zh-CN" th:fragment="html (content)">
  <!-- ========================================== -->
  <!--     鍗曢〉闈㈠竷灞€ - 闅愮鏉′緥/浣跨敤鏉℃锟?          -->
  <!-- ========================================== -->

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 鍚敤 View Transitions API (Safari 18+/Chrome 111+) -->
    <meta name="view-transition" content="same-origin" />

    <!-- 闃叉涓婚闂儊 -->
    <th:block th:replace="~{modules/theme-script :: inline-script}" />

    <!-- 椤甸潰鏍囬 -->
    <title
      th:text="${singlePage.spec.title} + ' - ' + ${site.title} + (${site.subtitle != null and !#strings.isEmpty(site.subtitle)} ? ' - ' + ${site.subtitle} : '')"
    >
    </title>

    <!-- 瀛椾綋 -->
    <th:block th:replace="~{modules/font-loader :: fonts}" />
    <!-- 涓婚鏍峰紡 -->
    <link rel="stylesheet" th:href="@{/assets/css/main.css?v={version}(version='1.0.14')}" />
    <!-- 椤甸潰鏍峰紡 -->
    <link rel="stylesheet" th:href="@{/assets/css/page.css?v={version}(version='1.0.14')}" />
    <!-- 闊充箰鎾斁锟?CSS -->
    <th:block th:replace="~{modules/music-player :: head}" />
  </head>

  <body
    th:with="bgConfig = ${theme.config.general.global_background},
                 enableCustomBg = ${bgConfig?.enable_custom == true},
                 bgStyle = ${bgConfig?.background_style ?: 'base-200'},
                 bgClass = ${enableCustomBg ? (bgStyle == 'grid' ? 'bg-base-100' : 'bg-' + bgStyle) : 'bg-base-200'}"
    th:class="'min-h-screen relative flex flex-col ' + ${bgClass}"
  >
    <!-- 缃戞牸鑳屾櫙锛堜粎褰撻€夋嫨 grid 鏍峰紡鏃舵樉绀猴級 -->
    <div
      th:if="${enableCustomBg and bgStyle == 'grid'}"
      class="bg-grid-pattern pointer-events-none fixed inset-0 z-[1]"
    ></div>

    <div class="relative z-10">
      <!-- 鍔犺浇灞忓箷 -->
      <th:block th:replace="~{modules/loading-screen :: loading-screen}" />

      <!-- 瀵艰埅锟?-->
      <th:block th:replace="~{modules/nav :: navbar}" />

      <!-- 涓昏鍐呭 -->
      <main id="swup" class="flex-1">
        <th:block th:replace="${content}" />
      </main>

      <!-- 椤佃剼 -->
      <th:block th:replace="~{modules/footer :: footer}" />
    </div>

    <div id="swup-page-extras">
      <!-- 鎮诞 Dock -->
      <th:block th:replace="~{modules/floating-dock :: dock}" />
    </div>

    <!-- JavaScript - 浣跨敤 ES Module -->
    <div id="swup-scripts" hidden>
      <script
        type="module"
        th:src="@{/assets/js/page.js?v={version}(version='1.0.14')}"
        data-swup-reload-script
      ></script>
    </div>
    <script type="module" th:src="@{/assets/js/main.js?v={version}(version='1.0.14')}"></script>
    <!-- 鎮诞闊充箰鎾斁锟?-->
    <th:block th:replace="~{modules/music-player :: player}" />
  </body>
</html>
