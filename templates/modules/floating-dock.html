<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- ========================================== -->
<!--             鎮诞鎺у埗鏍忕粍浠?                 -->
<!-- ========================================== -->

<!-- 
  鍙傛暟璇存槑锛?  - pageCfg: 椤甸潰閰嶇疆锛堝彲閫夛級锛屽寘鍚?floating_dock 瀛愰厤缃?  - pageType: 椤甸潰绫诲瀷 - basic(鍩虹) | comment(鏀寔璇勮)
  - 濡傛灉 pageCfg.floating_dock.enable_custom_dock == true锛屼娇鐢ㄩ〉闈㈣嚜瀹氫箟閰嶇疆
  - 鍚﹀垯浣跨敤鍏ㄥ眬 general.floating_dock 閰嶇疆
-->

<!-- 閫氱敤鎮诞 Dock 鐗囨锛堜繚鎸佸悜鍚庡吋瀹癸級 -->
<th:block th:fragment="dock">
  <th:block th:replace="~{:: dockWithConfig(null, 'basic')}" />
</th:block>

<!-- 鏀寔浼犲弬鐨勬偓娴?Dock 鐗囨 - 鏍规嵁鏍峰紡閫夋嫨鏄剧ず搴曢儴鎴栧彸渚?-->
<th:block th:fragment="dockWithConfig(pageCfg, pageType)" th:with="globalCfg = ${theme.config.general.floating_dock},
                   dockStyle = ${globalCfg?.dock_style ?: 'bottom'},
                   useCustom = ${pageCfg?.floating_dock?.enable_custom_dock == true},
                   cfg = ${useCustom ? pageCfg.floating_dock : globalCfg},
                   enableDock = ${cfg?.enable_dock != false},
                   dockMenuName = ${cfg?.dock_menu ?: 'primary'},
                   enableBackToTop = ${cfg?.enable_back_to_top != false}">
  <!-- 搴曢儴灞呬腑鏍峰紡 -->
  <th:block th:if="${enableDock and dockStyle != 'side'}" th:insert="~{:: bottomDockInner}" />
  <!-- 鍙充晶鍙姌鍙犳牱寮?-->
  <th:block th:if="${enableDock and dockStyle == 'side'}" th:insert="~{:: sideDockInner}" />
</th:block>

<!-- 搴曢儴灞呬腑鎮诞 Dock锛堝唴閮ㄧ墖娈碉紝缁ф壙鐖剁骇鍙橀噺锛?-->
<th:block th:fragment="bottomDockInner">
  <div x-data="floatingDock" x-show="isVisible" x-transition:enter="transition ease-in-out duration-400"
    x-transition:enter-start="opacity-0 translate-y-8" x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in-out duration-300" x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 translate-y-4" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40">

    <!-- Dock 瀹瑰櫒 -->
    <div
      class="dock-container bg-base-100/90 backdrop-blur-md shadow-lg rounded-full border border-base-300/30 px-2 py-1.5">

      <!-- Dock 鎸夐挳缁?-->
      <div class="flex items-center gap-1">

        <!-- 鑷畾涔夎彍鍗曞浘鏍?-->
        <th:block th:with="dockMenu = ${menuFinder.getByName(dockMenuName)}">
          <th:block th:if="${dockMenu != null}">
            <a th:each="menuItem : ${dockMenu.menuItems}" th:href="@{${menuItem.status.href}}"
              th:target="${menuItem.spec.target?.value}" class="dock-item dock-btn group relative"
              th:title="${menuItem.status.displayName}" th:aria-label="${menuItem.status.displayName}">
              <!-- 浣跨敤鑿滃崟鐨勮嚜瀹氫箟鍏冩暟鎹?icon 瀛楁锛圫VG 浠ｇ爜锛?-->
              <div th:if="${menuItem.metadata?.annotations != null && menuItem.metadata.annotations['icon'] != null}"
                class="w-4 h-4 transition-transform duration-200 group-hover:scale-110 flex items-center justify-center">
                <div th:utext="${menuItem.metadata.annotations['icon']}" class="dock-icon-svg"></div>
              </div>
              <!-- 澶囩敤鍥炬爣锛堝鏋滄病鏈夎嚜瀹氫箟 icon锛?-->
              <span
                th:unless="${menuItem.metadata?.annotations != null && menuItem.metadata.annotations['icon'] != null}"
                class="icon-[heroicons--home] w-4 h-4 transition-transform duration-200 group-hover:scale-110">
              </span>
              <span
                class="dock-tooltip absolute -top-10 left-1/2 -translate-x-1/2 px-2 py-1 bg-base-content text-base-100 text-xs rounded opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap pointer-events-none"
                th:text="${menuItem.status.displayName}">
              </span>
            </a>
          </th:block>
        </th:block>

        <!-- 鍒嗛殧绾匡紙褰撴湁鍚庣画鍔熻兘鏃舵樉绀猴級 -->
        <div class="w-px h-6" th:if="${enableBackToTop}"></div>

        <!-- 杩斿洖椤堕儴鎸夐挳 -->
        <button th:if="${enableBackToTop}" @click="scrollToTop()" class="dock-item dock-btn" title="杩斿洖椤堕儴"
          aria-label="杩斿洖椤堕儴">
          <span class="icon-[heroicons--arrow-up] w-4 h-4"></span>
        </button>

      </div>
    </div>

  </div>
</th:block>

<!-- ========================================== -->
<!--   鍙充晶鍙姌鍙犳偓娴?Dock锛堜娇鐢?DaisyUI FAB锛?   -->
<!-- ========================================== -->

<th:block th:fragment="sideDockInner">
  <div x-data="sideFloatingDock" x-show="isVisible" class="fixed right-4 bottom-6 z-40">

    <!-- DaisyUI FAB 缁勪欢 -->
    <div class="fab fab-top">
      <!-- 瑙﹀彂鎸夐挳 -->
      <div tabindex="0" role="button" class="btn btn-circle btn-primary shadow-lg">
        <span class="icon-[heroicons--squares-2x2] w-5 h-5"></span>
      </div>

      <!-- 鍏抽棴鎸夐挳锛堝睍寮€鏃舵樉绀猴級 -->
      <div class="fab-close">
        <span class="text-sm whitespace-nowrap text-base-content/70 hidden sm:block">鍏抽棴</span>
        <span class="btn btn-circle btn-neutral shadow-lg">
          <span class="icon-[heroicons--x-mark] w-5 h-5"></span>
        </span>
      </div>

      <!-- 鑷畾涔夎彍鍗曢」 -->
      <th:block th:with="dockMenu = ${menuFinder.getByName(dockMenuName)}">
        <th:block th:if="${dockMenu != null}">
          <div th:each="menuItem : ${dockMenu.menuItems}">
            <span class="text-sm whitespace-nowrap hidden sm:block" th:text="${menuItem.status.displayName}">鑿滃崟</span>
            <a th:href="@{${menuItem.status.href}}" th:target="${menuItem.spec.target?.value}" class="btn btn-circle"
              th:title="${menuItem.status.displayName}" th:aria-label="${menuItem.status.displayName}">
              <div th:if="${menuItem.metadata?.annotations != null && menuItem.metadata.annotations['icon'] != null}"
                class="w-5 h-5 flex items-center justify-center">
                <div th:utext="${menuItem.metadata.annotations['icon']}" class="dock-icon-svg"></div>
              </div>
              <span
                th:unless="${menuItem.metadata?.annotations != null && menuItem.metadata.annotations['icon'] != null}"
                class="icon-[heroicons--home] w-5 h-5"></span>
            </a>
          </div>
        </th:block>
      </th:block>

      <!-- 杩斿洖椤堕儴鎸夐挳 -->
      <div th:if="${enableBackToTop}">
        <span class="text-sm whitespace-nowrap hidden sm:block">杩斿洖椤堕儴</span>
        <button class="btn btn-circle" @click="scrollToTop()">
          <span class="icon-[heroicons--arrow-up] w-5 h-5"></span>
        </button>
      </div>
    </div>

  </div>
</th:block>

</html>
