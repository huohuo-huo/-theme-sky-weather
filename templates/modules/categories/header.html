<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- ========================================== -->
<!--           鍒嗙被椤靛ご閮?Banner锛堥€氱敤锛?         -->
<!-- 璇存槑锛氳瑙夌粨鏋勫弬鑰?modules/post/header.html   -->
<!--       鍦ㄥ垎绫荤储寮曚笌鍒嗙被褰掓。椤靛潎鍙鐢?         -->
<!-- ========================================== -->

<header th:fragment="banner"
        class="category-banner relative w-full h-[50vh] md:h-[60vh] overflow-hidden transition-all duration-500 ease-out"
        th:with="headerBgSettings=${theme.config.article.header_background}">
  <!-- 鑳屾櫙鍥剧墖灞傦紙涓?post 缁撴瀯涓€鑷达級 -->
  <div class="absolute inset-0 z-0">
    <img class="absolute inset-0 w-full h-full object-cover object-center transition-all duration-1000 filter blur-[0.5px] will-change-transform"
         th:with="
           backgroundImage=${
             headerBgSettings.background_type == 'custom_url' ? 
               (headerBgSettings.custom_image_url != null and !headerBgSettings.custom_image_url.isEmpty() ? headerBgSettings.custom_image_url : 'https://www.dmoe.cc/random.php') : 
             headerBgSettings.background_type == 'upload' ? 
               (headerBgSettings.upload_image != null and !headerBgSettings.upload_image.isEmpty() ? headerBgSettings.upload_image : 'https://www.dmoe.cc/random.php') : 
               'https://www.dmoe.cc/random.php'
           }
         "
         th:src="${backgroundImage}"
         alt="鍒嗙被鑳屾櫙鍥?>

    <!-- 钂欑増缁勫悎锛堜笌 post 淇濇寔涓€鑷寸殑灞傜骇涓庨鏍硷級 -->
    <div class="absolute inset-0">
      <div class="absolute inset-0 bg-black/30 bg-gradient-to-b from-black/10 via-black/50 to-black/80"></div>
      <div class="absolute inset-0 bg-black/20 transition-opacity duration-500"></div>
    </div>
  </div>

  <!-- Banner 鍐呭鍖?-->
  <div class="relative z-10 flex flex-col justify-end items-center h-full px-4 pb-12 md:pb-16 text-center text-white">
    <!-- 鏍囬锛氱储寮曢〉鏄剧ず鈥滃垎绫烩€濓紝褰掓。椤垫樉绀哄叿浣撳垎绫诲悕绉?-->
    <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold mb-4 leading-tight max-w-4xl text-white"
        th:text="${category != null ? category.spec.displayName : '鍒嗙被'}">
      鍒嗙被
    </h1>

    <!-- 缇庤鍒嗛殧绗?-->
    <div class="w-16 h-0.5 bg-white mb-3 rounded-full opacity-80"></div>

    <!-- 鎻忚堪锛氫粎鍦ㄥ綊妗ｉ〉瀛樺湪鎻忚堪鏃舵樉绀?-->
    <p class="text-base mb-4 max-w-3xl leading-relaxed text-white/80 line-clamp-3"
       th:if="${category != null and category.spec.description != null}"
       th:text="${category.spec.description}"></p>

    <!-- 鍏冧俊鎭細绱㈠紩椤垫樉绀虹珯鐐瑰壇鏍囬锛屽綊妗ｉ〉鏄剧ず鏂囩珷璁℃暟锛堣嫢浼犲叆锛?-->
    <div class="flex flex-wrap justify-center items-center gap-3 text-sm text-white/90">
      <div th:if="${category == null}" class="flex items-center gap-2">
        <span class="icon-[heroicons--rectangle-stack] w-4 h-4"></span>
        <span th:text="${site.subtitle}">娆㈣繋娴忚鎵€鏈夊垎绫?/span>
      </div>
      <div th:if="${category != null and posts != null}" class="flex items-center gap-2">
        <span class="icon-[heroicons--document-text] w-4 h-4"></span>
        <span th:text="|鏈垎绫诲叡 ${posts.total} 绡囨枃绔爘">鍏?N 绡囨枃绔?/span>
      </div>
    </div>
  </div>
</header>

</html>
