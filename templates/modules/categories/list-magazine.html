<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- Magazine 杂志风格：显式封面优先，无封面时退化为文字摘要卡片。 -->
<section th:fragment="magazine(posts, settings)" class="article-magazine-grid grid grid-cols-1 md:grid-cols-2 gap-6">
  <article th:each="post : ${posts.items}"
    th:with="isPinned=${post.spec.pinned == true},
             coverUrl=${post.spec.cover != null and !#strings.isEmpty(post.spec.cover) and !#strings.contains(post.spec.cover, 'dmoe.cc') ? post.spec.cover : null},
             excerptText=${(post.spec.excerpt != null and post.spec.excerpt.raw != null and !post.spec.excerpt.raw.isEmpty()) ? post.spec.excerpt.raw : (post.status.excerpt ?: '')}"
    class="group relative overflow-hidden rounded-[2rem] bg-base-100/80 backdrop-blur-xl shadow-lg border border-base-content/5 hover:shadow-2xl hover:border-primary/20 transition-all duration-300">

    <!-- 作者明确设置封面时保留沉浸式杂志卡片。标题始终可见，hover 仅增强图片与遮罩。 -->
    <div th:if="${coverUrl != null}" class="relative aspect-video overflow-hidden bg-gradient-to-br from-primary/90 via-primary/70 to-secondary/90">
      <a th:href="@{${post.status.permalink}}" class="absolute inset-0 block">
        <img th:src="${coverUrl}" th:alt="|${post.spec.title} 的封面|" loading="lazy"
          onerror="this.style.display='none'"
          class="absolute inset-0 w-full h-full object-cover transform scale-100 group-hover:scale-105 transition-transform duration-1000 ease-[cubic-bezier(0.25,0.1,0.25,1)]" />
      </a>

      <div class="absolute inset-0 bg-black/10 pointer-events-none"></div>
      <div
        class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent opacity-100 group-hover:opacity-90 transition-opacity duration-500 pointer-events-none">
      </div>

      <span th:if="${isPinned}"
        class="absolute top-3 left-3 z-10 px-2 py-0.5 rounded-md text-[10px] font-bold text-white bg-gradient-to-r from-pink-500 to-rose-500 shadow-sm backdrop-blur-md">置顶</span>

      <div class="absolute bottom-0 left-0 right-0 px-6 pb-5 flex flex-col justify-end pointer-events-none">
        <div class="pb-4 flex flex-col items-start gap-3">
          <div th:if="${!#lists.isEmpty(post.categories)}" th:with="firstCat=${post.categories[0]}"
            class="transform translate-y-0 opacity-100 transition-all duration-300 pointer-events-auto">
            <a th:href="@{${firstCat.status.permalink}}"
              class="inline-block px-2.5 py-1 rounded-md bg-white/15 hover:bg-white/25 backdrop-blur-sm text-[11px] font-medium text-white/90 tracking-wide transition-colors"
              th:text="${firstCat.spec.displayName}">分类</a>
          </div>

          <h3
            class="transform translate-y-0 opacity-100 transition-all duration-300 text-lg md:text-xl font-bold leading-snug drop-shadow-lg tracking-tight text-white pointer-events-auto line-clamp-2">
            <a th:href="@{${post.status.permalink}}" th:text="${post.spec.title}">文章标题</a>
          </h3>
        </div>

        <div class="flex flex-wrap items-center gap-3 text-xs text-white/70 font-medium">
          <span class="inline-flex items-center gap-1">
            <span class="icon-[heroicons--calendar-days] w-3.5 h-3.5 opacity-70"></span>
            <time th:text="${#dates.format(post.spec.publishTime,'yyyy-MM-dd')}">2025-01-01</time>
          </span>
          <span class="w-0.5 h-0.5 rounded-full bg-white/30"></span>
          <span class="inline-flex items-center gap-1">
            <span class="icon-[heroicons--eye] w-3.5 h-3.5 opacity-70"></span>
            <span th:text="${post.stats.visit ?: 0}">0</span>
          </span>
          <span class="inline-flex items-center gap-1">
            <span class="icon-[heroicons--heart] w-3.5 h-3.5 opacity-70"></span>
            <span th:text="${post.stats.upvote ?: 0}">0</span>
          </span>
        </div>
      </div>
    </div>

    <!-- 无封面时不伪造图片，直接展示可读的文章摘要。 -->
    <div th:if="${coverUrl == null}" class="relative aspect-video p-6 flex flex-col bg-gradient-to-br from-base-100 via-base-100/90 to-primary/10">
      <div class="flex items-center justify-between gap-3 text-xs text-base-content/60">
        <span th:if="${isPinned}"
          class="px-2 py-0.5 rounded-md text-[10px] font-bold text-white bg-gradient-to-r from-pink-500 to-rose-500 shadow-sm">置顶</span>
        <span th:unless="${isPinned}" class="inline-flex items-center gap-1 text-primary font-medium">
          <span class="icon-[heroicons--document-text] w-4 h-4"></span>
          技术文章
        </span>
        <time class="ml-auto" th:text="${#dates.format(post.spec.publishTime,'yyyy-MM-dd')}">2025-01-01</time>
      </div>

      <div class="flex-1 flex flex-col justify-center">
        <h3 class="text-lg md:text-xl font-bold leading-snug tracking-tight text-base-content line-clamp-2">
          <a th:href="@{${post.status.permalink}}" class="hover:text-primary transition-colors"
            th:text="${post.spec.title}">文章标题</a>
        </h3>
        <p th:if="${excerptText != null and !#strings.isEmpty(excerptText)}"
          class="mt-3 text-sm text-base-content/70 leading-relaxed line-clamp-3">
          <a th:href="@{${post.status.permalink}}" class="hover:text-base-content" th:text="${excerptText}">文章摘要</a>
        </p>
      </div>

      <div class="pt-4 border-t border-base-content/5 flex items-center gap-3 text-xs text-base-content/60">
        <a th:if="${!#lists.isEmpty(post.categories)}" th:with="firstCat=${post.categories[0]}"
          th:href="@{${firstCat.status.permalink}}" class="text-primary hover:underline"
          th:text="${firstCat.spec.displayName}">分类</a>
        <span class="ml-auto inline-flex items-center gap-1">
          <span class="icon-[heroicons--eye] w-3.5 h-3.5"></span>
          <span th:text="${post.stats.visit ?: 0}">0</span>
        </span>
        <span class="inline-flex items-center gap-1">
          <span class="icon-[heroicons--heart] w-3.5 h-3.5"></span>
          <span th:text="${post.stats.upvote ?: 0}">0</span>
        </span>
      </div>
    </div>
  </article>
</section>

</html>
