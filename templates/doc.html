<!-- Docsme 鏂囨。鍐呭椤甸潰 - 瀹屽叏鑷畾涔?-->
<!-- 鍏煎鍩虹嚎锛歱lugin-docsme 鍏嶈垂鐗?1.5.0 / 涓撲笟鐗?1.6.0锛涙秷璐?project/docTree/docTrees/crumbs/versions/languages/linkNavigation銆?-->
<!doctype html>
<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{modules/doc-layout :: html(head = ~{::head}, content = ~{::content}, scripts = ~{::scripts}, dock = ~{::dock})}">
<th:block th:fragment="head">
  <!-- 浠ｇ爜楂樹寒鏍峰紡 -->
  <th:block th:replace="~{plugin:plugin-docsme:modules/prism}" />
  <!-- Docsme/Shiki may inject a preview blur after theme CSS; keep published docs readable. -->
  <style>
    .doc-layout #article-content pre:has(code),
    .doc-layout #article-content pre,
    .doc-layout #doc-content pre:has(code),
    .doc-layout #doc-content pre {
      filter: none !important;
      -webkit-filter: none !important;
    }
  </style>
</th:block>
<th:block th:fragment="content">
  <th:block th:replace="~{modules/doc-content :: content}" />
</th:block>
<!-- 鏂囨。椤典笓鐢?Dock 鍜屾娊灞?-->
<th:block th:fragment="dock">
  <th:block th:replace="~{modules/doc/floating-dock :: doc-dock}" />
  <th:block th:replace="~{modules/doc/floating-dock :: doc-comment-drawer}" />
  <th:block th:replace="~{modules/doc/floating-dock :: doc-toc-drawer}" />
  <th:block th:replace="~{modules/doc/floating-dock :: doc-sidebar-drawer(config=null)}" />
</th:block>
<th:block th:fragment="scripts">
  <!-- 绂佺敤鎻掍欢鐨勪富棰樺垏鎹㈠姛鑳斤紝浣跨敤涓婚鑷甫鐨?-->
  <script>
    var docsme = { disableThemeFunction: true };
  </script>
  <!-- 鍏朵粬鎻掍欢鑴氭湰锛堟悳绱€佺粯鍥俱€並aTeX锛?-->
  <th:block th:replace="~{plugin:plugin-docsme:modules/plugin-scripts}" />
  <!-- 鐩綍鐢熸垚鑴氭湰宸茬Щ鑷?doc.js -->
</th:block>

</html>
