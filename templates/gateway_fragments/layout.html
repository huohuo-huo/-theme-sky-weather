<!doctype html>
<html th:lang="${#locale.toLanguageTag}" th:fragment="layout (title,head,body)" th:with="authLayout = ${theme.config.auth?.auth_settings?.auth_layout ?: 'default'},
               brandStyle = ${theme.config.auth?.auth_settings?.brand_style ?: 'simple'},
               cardEffect = ${(theme.config.auth?.auth_settings?.card_effect == 'none' || theme.config.auth?.auth_settings?.card_effect == null) ? '3d' : theme.config.auth?.auth_settings?.card_effect},
               brandSlogan = ${theme.config.auth?.auth_settings?.brand_slogan ?: '鎺㈢储銆佽褰曘€佸垎浜?},

               featuresWelcome = ${theme.config.auth?.auth_settings?.features_welcome ?: '娆㈣繋鏉ュ埌'},
               feature1Title = ${theme.config.auth?.auth_settings?.feature_1_title ?: '瀹夊叏鍙潬'},
               feature1Desc = ${theme.config.auth?.auth_settings?.feature_1_desc ?: '鍩轰簬 Halo 瀹夊叏浣撶郴鐨勮处鎴蜂繚鎶?},
               feature1Icon = ${theme.config.auth?.auth_settings?.feature_1_icon ?: 'icon-[heroicons--shield-check]'},
               feature2Title = ${theme.config.auth?.auth_settings?.feature_2_title ?: '娌夋蹈浣撻獙'},
               feature2Desc = ${theme.config.auth?.auth_settings?.feature_2_desc ?: '涓哄唴瀹规彁渚涘畨闈欐竻鏅扮殑闃呰浣撻獙'},
               feature2Icon = ${theme.config.auth?.auth_settings?.feature_2_icon ?: 'icon-[heroicons--sparkles]'},
               feature3Title = ${theme.config.auth?.auth_settings?.feature_3_title ?: '澶氱閫傞厤'},
               feature3Desc = ${theme.config.auth?.auth_settings?.feature_3_desc ?: '闅忔椂闅忓湴璁块棶浣犵殑鍒涗綔'},
               feature3Icon = ${theme.config.auth?.auth_settings?.feature_3_icon ?: 'icon-[heroicons--device-phone-mobile]'},
               authSideImage = ${theme.config.auth?.auth_settings?.auth_side_image},
               authLogo = ${theme.config.auth?.auth_settings?.auth_logo},
               authSiteTitle = ${theme.config.auth?.auth_settings?.auth_site_title},
               authSiteTitleSimple = ${theme.config.auth?.auth_settings?.auth_site_title_simple}">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2" />
    <title th:text="${title}">Auth</title>

    <th:block th:replace="~{modules/theme-script :: inline-script}" />
    <link rel="stylesheet" th:href="@{/assets/css/main.css?v={version}(version='1.0.24')}" />

    <!-- Auth 鐢啫鐪?CSS -->
    <link rel="stylesheet" th:href="@{'/assets/css/auth-' + ${authLayout} + '.css?v=1.0.24'}" />

    <th:block th:replace="~{gateway_fragments/common::basicStaticResources}"></th:block>

    <th:block th:if="${head != null}">
        <th:block th:replace="${head}" />
    </th:block>
</head>

<body class="font-sans text-base-content antialiased selection:bg-primary selection:text-primary-content">

    <!-- ======================== -->
    <!-- 鐢啫鐪?1: 缁犫偓濞蹭線绮敓?         -->
    <!-- ======================== -->
    <th:block th:if="${authLayout == 'default'}">
        <div class="auth-page-default">
            <div class="auth-card-default">
                <!-- Logo -->
                <div class="auth-logo-default">
                    <a href="/" class="flex items-center justify-center gap-3 group">
                        <img th:if="${site.logo != null and !site.logo.isEmpty()}" th:src="${site.logo}"
                            th:alt="${site.title}" class="w-10 h-10 rounded-xl shadow-md" />
                        <span class="text-2xl font-bold text-primary" th:text="${site.title}">Site</span>
                    </a>
                </div>
                <!-- 鐞涖劌宕熼崘鍛啇 -->
                <div class="auth-form-container">
                    <th:block th:replace="${body}" />
                </div>
            </div>
            <!-- 閻楀牊娼?-->
            <div class="auth-copyright-default">
                <span>&copy;</span>
                <a href="/" class="ml-1" th:text="${site.title}">Site</a>
            </div>
        </div>
    </th:block>

    <!-- ======================== -->
    <!-- 鐢啫鐪?2: 閸掑棗鐫嗙敮鍐ㄧ湰          -->
    <!-- ======================== -->
    <th:block th:if="${authLayout == 'split'}">
        <div class="auth-page-split">
            <!-- 閸濅胶澧濋敓?- 缁犫偓缁撅箓顥撻敓?-->
            <div th:if="${brandStyle == 'simple'}" class="auth-brand">
                <div class="grid-overlay"></div>
                <div class="floating-shape floating-shape-1"></div>
                <div class="floating-shape floating-shape-2"></div>
                <div class="floating-shape floating-shape-3"></div>
                <div class="brand-text">
                    <h1 th:text="${not #strings.isEmpty(authSiteTitleSimple) ? authSiteTitleSimple : site.title}">Huohuo
                        Weather Glass</h1>
                    <p th:text="${brandSlogan}">鎺㈢储銆佽褰曘€佸垎浜?/p>
                </div>
            </div>

            <!-- 閸濅胶澧濋敓?- 閸旂喕鍏橀悧瑙勨偓褔顥撻敓?-->
            <div th:if="${brandStyle == 'features'}" class="auth-brand auth-brand-features"
                th:style="${authSideImage != null ? 'background-image: url(' + authSideImage + ');' : ''}"
                th:data-has-image="${authSideImage != null}">
                <!-- 閸ュ墽澧栭柆顔惧兊 -->
                <div th:if="${authSideImage}" class="auth-brand-overlay"></div>
                <div class="features-content">
                    <div class="features-logo">
                        <img th:if="${not #strings.isEmpty(authLogo)} or ${site.logo}"
                            th:src="${not #strings.isEmpty(authLogo) ? authLogo : site.logo}" />
                        <h2 th:text="${not #strings.isEmpty(authSiteTitle) ? authSiteTitle : site.title}">Site</h2>
                    </div>
                    <h1 class="features-title" th:text="${featuresWelcome}">娆㈣繋鏉ュ埌</h1>
                    <p class="features-slogan" th:text="${brandSlogan}">鎺㈢储銆佽褰曘€佸垎浜?/p>
                    <ul class="features-list">
                        <li>
                            <span class="feature-icon"><span
                                    class="icon-[heroicons--shield-check] w-5 h-5"></span></span>
                            <div class="feature-text">
                                <h3 th:text="${feature1Title}">瀹夊叏鍙潬</h3>
                                <p th:text="${feature1Desc}">鍩轰簬 Halo 瀹夊叏浣撶郴鐨勮处鎴蜂繚鎶?/p>
                            </div>
                        </li>
                        <li>
                            <span class="feature-icon"><span class="icon-[heroicons--sparkles] w-5 h-5"></span></span>
                            <div class="feature-text">
                                <h3 th:text="${feature2Title}">娌夋蹈浣撻獙</h3>
                                <p th:text="${feature2Desc}">涓哄唴瀹规彁渚涘畨闈欐竻鏅扮殑闃呰浣撻獙</p>
                            </div>
                        </li>
                        <li>
                            <span class="feature-icon"><span
                                    class="icon-[heroicons--device-phone-mobile] w-5 h-5"></span></span>
                            <div class="feature-text">
                                <h3 th:text="${feature3Title}">澶氱閫傞厤</h3>
                                <p th:text="${feature3Desc}">闅忔椂闅忓湴璁块棶浣犵殑鍒涗綔</p>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- 閸濅胶澧濋敓?- 閸斻劍鈧焦褰冮悽濠氼棑閿?-->
            <div th:if="${brandStyle == 'illustration'}" class="auth-brand auth-brand-illustration">
                <div id="art-scene" class="art-scene state-idle">

                    <!-- 1. 缁鳖偉澹婄憴鎺曞 -->
                    <div class="char char-purple" style="--delay: 0.1;">
                        <div class="breathe-wrap">
                            <div class="face">
                                <div class="eye-white left">
                                    <div class="sad-lid"></div>
                                    <div class="pupil-wrap tracker">
                                        <div class="pupil"></div>
                                    </div>
                                </div>
                                <div class="eye-white right">
                                    <div class="sad-lid"></div>
                                    <div class="pupil-wrap tracker">
                                        <div class="pupil"></div>
                                    </div>
                                </div>
                                <div class="mouth-surprise"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 2. 姒涙垼澹婄憴鎺曞 -->
                    <div class="char char-black" style="--delay: 0.8;">
                        <div class="breathe-wrap">
                            <div class="face">
                                <div class="eye-white left">
                                    <div class="sad-lid"></div>
                                    <div class="pupil-wrap tracker">
                                        <div class="pupil"></div>
                                    </div>
                                </div>
                                <div class="eye-white right">
                                    <div class="sad-lid"></div>
                                    <div class="pupil-wrap tracker">
                                        <div class="pupil"></div>
                                    </div>
                                </div>
                                <div class="mouth-surprise"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. 姒涘嫯澹婄憴鎺曞 -->
                    <div class="char char-yellow" style="--delay: 0.4;">
                        <div class="breathe-wrap">
                            <div class="face">
                                <div class="blush"></div>
                                <div class="eye-dot-wrap tracker">
                                    <div class="eye-dot"></div>
                                </div>
                                <div class="beak"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 4. 濮楁瑨澹婄憴鎺曞 -->
                    <div class="char char-orange" style="--delay: 0.6;">
                        <div class="breathe-wrap">
                            <div class="face">
                                <div class="blush left"></div>
                                <div class="blush right"></div>
                                <div class="eye-dot-wrap left tracker">
                                    <div class="eye-dot"></div>
                                </div>
                                <div class="eye-dot-wrap right tracker">
                                    <div class="eye-dot"></div>
                                </div>
                                <div class="mouth-surprise"></div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="auth-form-section-split">
                <div class="auth-form-container">
                    <th:block th:replace="${body}" />
                </div>
                <div class="absolute bottom-6 left-0 right-0 auth-copyright">
                    <span>&copy;</span><a href="/" class="ml-1" th:text="${site.title}">Site</a>
                </div>
            </div>
        </div>
    </th:block>

    <!-- ======================== -->
    <!-- 鐢啫鐪?3: 鐏炲懍鑵戦崡锛勫          -->
    <!-- ======================== -->
    <th:block th:if="${authLayout == 'centered'}">
        <div class="auth-page-centered">
            <!-- 閼辨艾鍘滈悘顖炪€夐棃銏犲帨閿?-->
            <div th:if="${cardEffect == 'spotlight'}" class="spotlight-page-glow"></div>

            <!-- 閸楋紕澧?-->
            <div
                th:class="${cardEffect == '3d' ? 'auth-card auth-card-3d' : (cardEffect == 'spotlight' ? 'auth-card auth-card-spotlight' : 'auth-card')}">

                <!-- 閼辨艾鍘滈悘顖氬幢閻楀洤鍘滈敓?-->
                <th:block th:if="${cardEffect == 'spotlight'}">
                    <div class="spotlight-glow-container">
                        <div class="spotlight-card-glow"></div>
                    </div>
                </th:block>
                <div class="relative z-10">
                    <th:block th:replace="${body}" />
                </div>
            </div>
            <div class="mt-6 auth-copyright">
                <span>&copy;</span><a href="/" class="ml-1" th:text="${site.title}">Site</a>
            </div>
        </div>

        <!-- 3D 閺佸牊鐏夐懘姘拱 - 閺€鎯ф躬 DOM 娑斿鎮楃涵顔荤箽閸忓啰绀岀€涙ê婀?-->
        <script th:if="${cardEffect == '3d'}" th:inline="none">
            (function () {
                var card = document.querySelector('.auth-card-3d');
                if (card) {
                    card.addEventListener('mousemove', function (e) {
                        var rect = card.getBoundingClientRect();
                        var x = e.clientX - rect.left;
                        var y = e.clientY - rect.top;
                        var rotateX = (y - rect.height / 2) / 25;
                        var rotateY = (rect.width / 2 - x) / 25;
                        card.style.transform = 'rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) translateZ(10px)';
                    });
                    card.addEventListener('mouseleave', function () {
                        card.style.transform = 'rotateX(0) rotateY(0) translateZ(0)';
                    });
                }
            })();
        </script>

        <!-- 閼辨艾鍘滈悘顖涙櫏閺嬫粏鍓奸敓?- 閺€鎯ф躬 DOM 娑斿鎮楃涵顔荤箽閸忓啰绀岀€涙ê婀?-->
        <script th:if="${cardEffect == 'spotlight'}" th:inline="none">
            (function () {
                var pageGlow = document.querySelector('.spotlight-page-glow');
                var cardGlow = document.querySelector('.spotlight-card-glow');
                var card = document.querySelector('.auth-card-spotlight');

                if (pageGlow) {
                    document.addEventListener('mousemove', function (e) {
                        pageGlow.style.left = e.clientX + 'px';
                        pageGlow.style.top = e.clientY + 'px';
                    });
                }

                if (card && cardGlow) {
                    card.addEventListener('mouseenter', function () { cardGlow.style.opacity = '1'; });
                    card.addEventListener('mouseleave', function () { cardGlow.style.opacity = '0'; });
                    card.addEventListener('mousemove', function (e) {
                        var rect = card.getBoundingClientRect();
                        cardGlow.style.left = (e.clientX - rect.left) + 'px';
                        cardGlow.style.top = (e.clientY - rect.top) + 'px';
                    });
                }
            })();
        </script>
    </th:block>

    <!-- Auth 鐢啫鐪?JS -->
    <script type="module" th:src="@{'/assets/js/auth-' + ${authLayout} + '.js?v=1.0.24'}"></script>
</body>

</html>
